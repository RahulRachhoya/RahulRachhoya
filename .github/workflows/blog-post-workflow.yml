name: Latest Blog Posts

on:
  schedule:
    - cron: "0 0 * * 1"  # Weekly on Monday
  workflow_dispatch:

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Blog Post Workflow
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # Uncomment and update these lines if you have a blog feed:
          # feed_list: "https://rahulrachhoya.dev/rss.xml"
          # max_post_count: 5
          # comment_tag_name: "BLOG-POST-LIST"
          # template: "$title - $url"
          # commit_message: "📚 Update README with latest blog posts"
          # gh_token: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment the above and set your blog RSS feed to enable auto-updates
          
          # For now, this is a placeholder that can be activated later
          feed_list: ""
